stages:
  prepare:
    cmd: python -m kal_kitna.data
    deps:
      - data/raw
      - src/kal_kitna/data.py
    params:
      - data.families
    outs:
      - data/processed/perishables.parquet
      - data/processed/holidays.parquet

  explore:
    cmd: python -m kal_kitna.explore
    deps:
      - data/processed/perishables.parquet
      - src/kal_kitna/explore.py
    outs:
      - reports/figures:
          cache: false

  featurize:
    cmd: python -m kal_kitna.features
    deps:
      - data/processed/perishables.parquet
      - data/processed/holidays.parquet
      - src/kal_kitna/features.py
    params:
      - features
    outs:
      - data/features/features.parquet

  baseline:
    cmd: python -m kal_kitna.baseline
    deps:
      - data/features/features.parquet
      - src/kal_kitna/baseline.py
      - src/kal_kitna/evaluation.py
    params:
      - split
    metrics:
      - reports/baseline.json:
          cache: false

  train:
    cmd: python -m kal_kitna.train
    deps:
      - data/features/features.parquet
      - reports/baseline.json
      - src/kal_kitna/train.py
      - src/kal_kitna/evaluation.py
    params:
      - split
      - model
    outs:
      - models/model.txt
      - reports/importance.json:
          cache: false
    metrics:
      - reports/metrics.json:
          cache: false

  decide:
    cmd: python -m kal_kitna.decide
    deps:
      - data/features/features.parquet
      - models/model.txt
      - src/kal_kitna/decide.py
      - src/kal_kitna/newsvendor.py
      - src/kal_kitna/evaluation.py
      - src/kal_kitna/train.py
    params:
      - split
      - costs
    metrics:
      - reports/business.json:
          cache: false

  export:
    cmd: python -m kal_kitna.export
    deps:
      - data/features/features.parquet
      - models/model.txt
      - src/kal_kitna/export.py
      - src/kal_kitna/decide.py
      - src/kal_kitna/train.py
    params:
      - split
      - costs
    outs:
      - models/serving